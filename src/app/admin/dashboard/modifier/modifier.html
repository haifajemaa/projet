
<div class="container py-5">

  <h2 class="text-center fw-bold mb-4">
    Modifier une montre
  </h2>

  <div class="card shadow-sm p-4 mx-auto" style="max-width: 700px;">
    <div class="mb-4">
      <label class="form-label">Identifiant de la montre</label>

      <div class="input-group">
        <input type="text" class="form-control"
          [(ngModel)]="idRecherche"
          placeholder="Entrer l'identifiant">

        <button class="btn btn-dark"
          (click)="rechercherWatch()">
          Rechercher
        </button>
      </div>
    </div>

    @if (selectedWatch) {

      <div class="alert alert-success">
        Montre trouvée : {{ selectedWatch.nom }}
      </div>
      <div class="mb-3">
        <label class="form-label">Champ à modifier</label>

        <select class="form-select" [(ngModel)]="champSelectionne">
          <option value="">Choisir un champ</option>
          <option value="nom">Nom</option>
          <option value="photo">Photo</option>
          <option value="prix">Prix</option>
          <option value="marque">Marque</option>
          <option value="quantite">Quantité</option>
          <option value="categorie">Catégorie</option>
        </select>
      </div>

      @if (champSelectionne) {
        <div class="mb-3">
          <label class="form-label">Nouvelle valeur</label>

          <input class="form-control"
            [type]="champSelectionne === 'prix' || champSelectionne === 'quantite' ? 'number' : 'text'"
            [(ngModel)]="nouvelleValeur">
        </div>

        <button class="btn btn-dark w-100"
          (click)="modifierWatch()">
          Enregistrer la modification
        </button>
      }
    }

    <a routerLink="/admin/dashboard"
      class="btn btn-outline-secondary mt-3">
      Annuler
    </a>

  </div>
</div>
