
<div class="container py-5">

  <h2 class="text-center fw-bold mb-4">Modifier une montre</h2>

  <div class="card shadow-sm p-4 mx-auto" style="max-width: 700px;">
    <div class="mb-4">
      <label class="form-label fw-semibold">
        Rechercher une montre
      </label>

      <div class="input-group">
        <input type="text" class="form-control"
               [(ngModel)]="idRecherche"
               placeholder="Entrer l'identifiant de la montre">

        <button type="button" class="btn btn-dark"
                (click)="rechercherWatch()">
          Rechercher
        </button>
      </div>
    </div>

    @if (selectedWatch) {

      <div class="alert alert-success">
        Montre trouvée : {{ selectedWatch.nom }}
      </div>

      
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Choisir le champ à modifier
        </label>

        <select class="form-select"
                [(ngModel)]="champSelectionne"
                (change)="nouvelleValeur = ''">

          <option value="">Choisir un champ</option>
          <option value="nom">Nom</option>
          <option value="photo">Photo</option>
          <option value="prix">Prix</option>
          <option value="marque">Marque</option>
          <option value="quantite">Quantité</option>
          <option value="categorie">Catégorie</option>
          <option value="dateAjout">Date d'ajout</option>
          
        </select>
      </div>

      @if (champSelectionne) {

        <div class="mb-3">

          <label class="form-label fw-semibold">
            Nouvelle valeur
          </label>

          @if (champSelectionne === 'categorie') {

            <select class="form-select"
                    [(ngModel)]="nouvelleValeur">
              <option value="">Choisir une catégorie</option>
              <option value="homme">Homme</option>
              <option value="femme">Femme</option>
            </select>

          
          } @else {

            <input class="form-control"
                   [type]="champSelectionne === 'prix' || champSelectionne === 'quantite'
                     ? 'number'
                     : champSelectionne === 'dateAjout'
                     ? 'date'
                     : 'text'"
                   [(ngModel)]="nouvelleValeur"
                   placeholder="Entrer la nouvelle valeur">

          }

        </div>

        <button type="button" class="btn btn-dark w-100"
                (click)="modifierWatch()">
          <i class="bi bi-pencil-square me-2"></i>
          Enregistrer la modification
        </button>

      }

    }
    <a routerLink="/admin/dashboard"
           class="btn btn-outline-secondary flex-fill">
          Annuler
        </a>

  </div>
</div>
