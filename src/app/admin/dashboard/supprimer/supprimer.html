
<div class="container py-5">

  <h2 class="fw-bold text-center mb-4">
    <i class="bi bi-trash text-danger me-2"></i>
    Supprimer une montre
  </h2>

  <p class="text-secondary text-center mb-4">
    Recherchez la montre que vous souhaitez supprimer.
  </p>

  <div class="card shadow-sm border-0 rounded-4 p-4 mx-auto"
       style="max-width: 650px;">

    <form [formRoot]="watchForm" (submit)="rechercherWatch()">

      <div class="mb-4">

        <label class="form-label fw-semibold" for="watchId">
  Rechercher une montre
</label>

<div class="input-group">

  <input type="text"
         id="watchId"
         class="form-control"
         [formField]="watchForm.id"
         placeholder="Identifiant de la montre">

  <button type="submit" class="btn btn-dark">
    <i class="bi bi-search me-2"></i>
    Rechercher
  </button>

</div>

      </div>

    </form>

    @if (selectedWatch) {

        <div class="alert alert-secondary">
          <h5 class="fw-bold">{{ selectedWatch.nom }}</h5>
        </div>

        @if (!confirmationSuppression) {

          <div class="d-flex gap-2">

            <button type="button"
                    class="btn btn-danger flex-fill"
                    (click)="confirmationSuppression = true">

              <i class="bi bi-trash me-2"></i>
              Supprimer

            </button>

            <a routerLink="/admin/dashboard"
              class="btn btn-outline-secondary flex-fill">
              Annuler
            </a>

          </div>

        } 
        
      @else {

    <div class="alert alert-warning">
      Voulez-vous vraiment supprimer cette montre ?
    </div>

    <div class="d-flex gap-2">

      <button type="button"
              class="btn btn-danger flex-fill"
              (click)="supprimerWatch()">
        Confirmer
      </button>

      <button type="button"
              class="btn btn-outline-secondary flex-fill"
              (click)="confirmationSuppression = false">
        Annuler
      </button>

    </div>

  }

}
<a routerLink="/admin/dashboard"
class="btn btn-outline-secondary flex-fill">
          Annuler
        </a>
